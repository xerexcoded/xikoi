[package]
name = "xikoi"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
description = "A local-first neuromancer voice interface for local AI"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/xerexcoded/xikoi"
repository = "https://github.com/xerexcoded/xikoi"
readme = "README.md"
keywords = ["ollama", "ratatui", "tui", "speech", "chat"]
categories = ["command-line-interface"]
include = [
  "/src/**",
  "/tests/**",
  "/Cargo.lock",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
  "/xikoi.png",
]

[dependencies]
async-trait = "0.1.91"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
color-eyre = "0.6.5"
cpal = "0.18.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
crossbeam-queue = "0.3.12"
futures-util = "0.3.33"
home = "0.5.12"
hound = "3.5.1"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
scope-tui = { version = "0.3.5", default-features = false, features = ["tui"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
textwrap = "0.16.2"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
